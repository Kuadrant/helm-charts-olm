name: Helm chart static analysis
on:
  push:
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # ratchet:helm/chart-testing-action@v2.8.0
      - name: Check if linting is required
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Add Helm repository dependencies
        if: steps.list-changed.outputs.changed == 'true'
        run: helm repo add hashicorp https://helm.releases.hashicorp.com
      - name: Run linting
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml
